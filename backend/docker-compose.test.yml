services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: indi_test
      POSTGRES_USER: indi_test
      POSTGRES_PASSWORD: indi_test_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indi_test -d indi_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
